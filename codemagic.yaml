workflows:
  tutu-ios-app-store:
    name: Tutu iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Tutu

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tutustyleoutfit.lookbook

      vars:
        BUNDLE_ID: "com.tutustyleoutfit.lookbook"
        XCODE_PROJECT: "Tutu.xcodeproj"
        XCODE_SCHEME: "Tutu"
        APP_STORE_APPLE_ID: "6823066661"

      xcode: "26.5"

    scripts:
      - name: Verify native iOS project configuration
        script: |
          set -e
          test -d "$CM_BUILD_DIR/$XCODE_PROJECT"
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme"
          test -f "$CM_BUILD_DIR/Tutu/Info.plist"
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" \
            "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"

      - name: Set up App Store signing
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles

      - name: Set next App Store build number
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          LATEST_BUILD_NUMBER="$(
            app-store-connect get-latest-build-number \
              "$APP_STORE_APPLE_ID"
          )"

          # Include uploaded TestFlight builds, not only App Store releases.
          # This app already has an uploaded build; an empty result is an error.
          if ! echo "$LATEST_BUILD_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "App Store Connect returned an empty or non-integer build number." >&2
            exit 1
          fi
          LOCAL_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Tutu/Info.plist)
          CI_BUILD_NUMBER="${PROJECT_BUILD_NUMBER:?Missing Codemagic project build number}"
          NEXT_BUILD_NUMBER=$(python3 - "$LATEST_BUILD_NUMBER" "$LOCAL_BUILD_NUMBER" "$CI_BUILD_NUMBER" <<'PY'
          import re
          import sys

          values = sys.argv[1:]
          if any(re.fullmatch(r"[0-9]+", value) is None for value in values):
              sys.exit("Build numbers must be non-negative integers.")
          remote, local, ci = map(int, values)
          print(max(remote + 1, local + 1, ci + 1))
          PY
          )

          echo "Remote: $LATEST_BUILD_NUMBER; local: $LOCAL_BUILD_NUMBER; CI: $CI_BUILD_NUMBER; next: $NEXT_BUILD_NUMBER"
          agvtool new-version -all "$NEXT_BUILD_NUMBER"
          # This project uses a checked-in plist with a literal CFBundleVersion.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT_BUILD_NUMBER" Tutu/Info.plist
          echo "TUTU_EXPECTED_BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> "$CM_ENV"
          echo "TUTU_PREVIOUS_BUILD_NUMBER=$LATEST_BUILD_NUMBER" >> "$CM_ENV"

      - name: Build signed IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      - name: Verify IPA build number before publishing
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          python3 - <<'PY'
          import os
          import pathlib
          import plistlib
          import re
          import zipfile

          packages = list(pathlib.Path("build/ios/ipa").glob("*.ipa"))
          if len(packages) != 1:
              raise SystemExit("Expected exactly one IPA for publishing.")
          with zipfile.ZipFile(packages[0]) as package:
              entries = [name for name in package.namelist()
                         if re.fullmatch(r"Payload/[^/]+\.app/Info\.plist", name)]
              if len(entries) != 1:
                  raise SystemExit("Expected exactly one main app Info.plist.")
              info = plistlib.loads(package.read(entries[0]))
          actual = str(info.get("CFBundleVersion", ""))
          expected = os.environ["TUTU_EXPECTED_BUILD_NUMBER"]
          if info.get("CFBundleIdentifier") != os.environ["BUNDLE_ID"]:
              raise SystemExit("IPA bundle identifier does not match the configured app.")
          if actual != expected or int(actual) <= int(os.environ["TUTU_PREVIOUS_BUILD_NUMBER"]):
              raise SystemExit(f"IPA build number mismatch: expected {expected}, got {actual}.")
          print(f"Verified {packages[0].name}: version {info.get('CFBundleShortVersionString')}, build {actual}")
          PY

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - funchan@126.com
        notify:
          success: true
          failure: true

      app_store_connect:
        # Upload the IPA to App Store Connect without automatically submitting review.
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
